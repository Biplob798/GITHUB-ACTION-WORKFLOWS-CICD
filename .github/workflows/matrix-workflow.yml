name: Matrix Workflow

on:
  workflow_dispatch:

jobs:
  matrix-job-workflow:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        uppercase: [A, B, C]
        lowercase: [a, b, c]

    steps:
      - name: Print Matrix Uppercase
        run: |
          echo "Uppercase: ${{ matrix.uppercase }}"

      - name: Print Matrix lowercase
        run: |
          echo "lowercase: ${{ matrix.lowercase }}"

      - name: Print Matrix All Combinations
        run: |
          echo "Combination: ${{ matrix.lowercase }} ${{ matrix.uppercase }}"