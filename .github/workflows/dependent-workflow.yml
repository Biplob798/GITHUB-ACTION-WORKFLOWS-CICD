name: Dependent Multi Jobs Workflow

on: 
  workflow_dispatch:

jobs:
  first-Dependent-workflow-job:
    runs-on: ubuntu-latest
    steps:
      - name: First Dependent Workflow Job
        run: |
          echo "Hello, First Workflow"

  second-Dependent-workflow-job:
    runs-on: ubuntu-latest
    needs: [first-Dependent-workflow-job]
    steps:
      - name: Second DependentWorkflow Job
        run: |
          echo "Hello, Second Workflow"

  third-Dependent-workflow-job:
    runs-on: ubuntu-latest
    needs: [first-Dependent-workflow-job, second-Dependent-workflow-job]
    steps:
      - name: Third Dependent Workflow Job
        run: |
          echo "Hello, Third Workflow"