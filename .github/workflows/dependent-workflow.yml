name: Dependent job workflow

on: 
  workflow_dispatch:

jobs:
  first-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: First job step
        run: |
          echo "Hello Multi Job Workflow"
          echo "Hello again"

  second-workflow:
    runs-on: ubuntu-latest
    needs: [first-workflow]
    steps:
      - name: Second job step
        run: |
          echo "Hello Multi Job Workflow Second Job"
          echo "Hello again"

  third-workflow:
    runs-on: ubuntu-latest
    needs: [first-workflow, second-workflow]
    steps:
      - name: Third job step
        run: |
          echo "Hello Multi Job Workflow third Job"
          echo "Hello again"